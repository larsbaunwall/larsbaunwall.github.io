baseURL = "https://larsbaunwall.github.io/"
locale = "en-GB"
title = "Lars Baunwall"
disableKinds = ["taxonomy", "term", "RSS", "section"]
enableRobotsTXT = true

[params]
  description = "Curriculum vitae of Lars Baunwall"
  # Optional: shown in the contact block on the page and in both PDFs.
  email = ""
  [params.pdf]
    full = "lars-baunwall-cv.pdf"
    onepage = "lars-baunwall-cv-onepage.pdf"
  [[params.links]]
    label = "LinkedIn"
    display = "linkedin.com/in/larsbaunwall"
    url = "https://www.linkedin.com/in/larsbaunwall/"
  [[params.links]]
    label = "GitHub"
    display = "github.com/larsbaunwall"
    url = "https://github.com/larsbaunwall"

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 82

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/source-serif-4/files"
    target = "static/fonts/source-serif-4"
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/inter/files"
    target = "static/fonts/inter"
