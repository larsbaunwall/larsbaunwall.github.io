name: Build and deploy CV site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"   # Sundays 23:00 UTC = 00:00 CET / 01:00 CEST (Monday)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: "0.163.0"
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch CV from LinkedIn
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          UNLINKED_CACHE_TTL: "0"
        run: npm run fetch

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - id: pages
        uses: actions/configure-pages@v5

      - run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - run: npx playwright install --with-deps chromium

      - run: npm run pdf

      - name: Check outputs
        run: |
          test -s public/index.html
          for f in public/lars-baunwall-cv.pdf public/lars-baunwall-cv-onepage.pdf; do
            test -s "$f"
            head -c 5 "$f" | grep -q '%PDF-'
          done
          grep -q 'content="noindex' public/print/onepage/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repo activity.
  # Re-enabling the workflow on each scheduled run resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
